[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://linebalance-pro.onrender.com/api/:splat"
  status = 200
  force = true

[[edge_functions]]
  function = "auth-gate"
  path = "/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
