target-version = "py312"
line-length = 88

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "ISC", # implicit string concatenation
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is enforced by the formatter
]

[lint.per-file-ignores]
"tests/*" = ["C408"] # dict(...) fixtures are clearer in tests
